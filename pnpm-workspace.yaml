packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# Supply-chain hardening: refuse versions published less than 3 days ago (value is in minutes).
minimumReleaseAge: 4320

# unrs-resolver gets its native binding from optionalDependencies (locked, integrity-checked);
# its postinstall would download artifacts outside lockfile integrity, so it must not run.
ignoredBuiltDependencies:
  - unrs-resolver
# Fail the install when any other dependency wants to run a build script that is not reviewed.
strictDepBuilds: true
# Reviewed build scripts (allow-list). Each entry: what the script does and why the app needs it.
onlyBuiltDependencies:
  # postinstall `scripts/install-libs.js` (reviewed at 2.6.2): local file copies only, no network, no exec. It copies
  # the prebuilt Skia binaries from its own pinned, lockfile-integrity-checked dependencies
  # (react-native-skia-android / -apple-*) into its libs/ folder for native builds (EAS). The JS bundle does not
  # depend on it. Re-review on every version bump (apps/mobile, E-1.5 S1).
  - "@shopify/react-native-skia"

# Security overrides: each one names its advisory and is recorded in docs/security/audit-exceptions.md.
overrides:
  # GHSA-w5hq-g745-h8pq (uuid < 11.1.1): xcode 3.0.1 (via expo > @expo/config-plugins) pins uuid ^7.0.3 and only
  # calls require('uuid').v4(); 11.1.1 is the patched release that still ships a CommonJS build.
  "xcode>uuid": 11.1.1
  # GHSA-68fv-2mgg-jv7q (source-map-js >=1.0.0 <1.2.2, high): dev-only via @vitest/coverage-v8 > magicast; 1.2.2 is
  # the patched release in the same major.
  "source-map-js@>=1.0.0 <1.2.2": ^1.2.2
  # GHSA-hp3w-g68c-fv3c (sprintf-js <= 1.1.3, moderate, no patched version): js-yaml 3.x requires argparse 1.x (and
  # through it sprintf-js) only from its CLI bin/js-yaml.js, never from the library that babel-plugin-istanbul >
  # @istanbuljs/load-nyc-config loads; dropping the dependency removes sprintf-js from the graph.
  "js-yaml@<4>argparse": "-"
  # GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f (handlebars < 4.7.10, critical): dev-only via eslint-plugin-boundaries
  # (and its @boundaries/elements), which renders lint messages, never user input; 4.7.10 is the patched release in
  # the same major.
  "handlebars@<4.7.10": ^4.7.10

# Audit exceptions: each one needs a written justification, an expiry date and a security-engineer review
# (CLAUDE.md §7). Register: docs/security/audit-exceptions.md. Remove an entry as soon as a fix is published.
auditConfig:
  ignoreGhsas:
    # braces <= 3.0.3 (no patched version yet), toolchain only via micromatch under eslint-plugin-boundaries, metro and
    # jest-haste-map (register class T); absence from the shipped bundles is proven by apps/mobile `bundle:check`
    # (bundle-forbidden-packages.json). Expires 2026-11-04.
    - GHSA-vfj7-8cjw-p6xm
    # node-forge <= 1.4.0 (no patched version yet), toolchain only via expo > @expo/cli (register class T); absence
    # from the shipped bundles is proven by apps/mobile `bundle:check` (bundle-forbidden-packages.json). Expires 2026-11-04.
    - GHSA-86w9-cpqp-85rv
