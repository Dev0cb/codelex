packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# Supply-chain hardening: refuse versions published less than 3 days ago (value is in minutes).
minimumReleaseAge: 4320

# unrs-resolver gets its native binding from optionalDependencies (locked, integrity-checked);
# its postinstall would download artifacts outside lockfile integrity, so it must not run.
ignoredBuiltDependencies:
  - unrs-resolver
# Fail the install when any other dependency wants to run a build script that is not reviewed.
strictDepBuilds: true
# Reviewed build scripts (allow-list). Each entry: what the script does and why the app needs it.
onlyBuiltDependencies:
  # postinstall `scripts/install-libs.js` (reviewed at 2.6.2): local file copies only, no network, no exec. It copies
  # the prebuilt Skia binaries from its own pinned, lockfile-integrity-checked dependencies
  # (react-native-skia-android / -apple-*) into its libs/ folder for native builds (EAS). The JS bundle does not
  # depend on it. Re-review on every version bump (apps/mobile, E-1.5 S1).
  - "@shopify/react-native-skia"

# Audit exceptions: each one needs a written justification, an expiry date and a security-engineer review
# (CLAUDE.md §7). Register: docs/security/audit-exceptions.md. Remove an entry as soon as a fix is published.
auditConfig:
  ignoreGhsas:
    # braces <= 3.0.3 (no patched version yet), dev-only via eslint-plugin-boundaries > micromatch. Expires 2026-11-02.
    - GHSA-vfj7-8cjw-p6xm
    # node-forge <= 1.4.0 (no patched version yet), toolchain only via expo > @expo/cli (register class T); absence
    # from the shipped bundles is proven by apps/mobile `bundle:check` (bundle-forbidden-packages.json). Expires 2026-11-02.
    - GHSA-86w9-cpqp-85rv
