name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-and-lexicon:
    name: Framework & lexicon validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Zero-dependency validators: they must pass even before `pnpm install`.
      - run: node tools/framework/validate.mjs
      - run: node packages/lexicon/scripts/validate.mjs
      - run: node --test "tools/framework/*.test.mjs" "tools/scaffold/*.test.mjs"

  workspace:
    name: Lint, typecheck & test (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Needs the installed TypeScript (it parses the tests), so it cannot sit in the zero-dependency job above.
      - name: Rule traceability (every Phase-1 rule ID has a tagged assertion)
        run: |
          pnpm traceability:check
          pnpm test:traceability
      - name: Affected tasks
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FILTER="--filter=...[origin/${BASE_REF}]"
          else
            FILTER=""
          fi
          pnpm turbo run lint typecheck format:check ${FILTER:+"$FILTER"}
          # Test suites run one package at a time: each vitest --coverage run already spreads its own workers
          # over every core, and timing-bound tests (spawned vitest runs, speed gates) time out when several
          # suites share the 4-vCPU runner.
          pnpm turbo run test --concurrency=1 ${FILTER:+"$FILTER"}
      # Mobile bundle budget (expo export + hermesc, no native build). A separate step so the CPU-heavy export does
      # not compete with the timed test suites above.
      - name: Bundle-size budget (affected)
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm turbo run bundle:check --filter="...[origin/${BASE_REF}]"
          else
            pnpm turbo run bundle:check
          fi
      # Lexicon index benchmarks (lexicon-index note §5, T8): JSON trend data, reporting only. The hard speed gates
      # are in the lexicon tests above; this step never fails the job. It reuses the build:index output when the
      # tests above built it (local turbo cache), otherwise builds it once (a few seconds).
      - name: Lexicon index benchmarks (non-gating)
        id: lexicon-bench
        continue-on-error: true
        run: pnpm turbo run bench:index --filter=@codelex/lexicon
      - name: Upload lexicon index benchmarks
        if: steps.lexicon-bench.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lexicon-index-bench
          path: packages/lexicon/dist/bench/index-bench.json
          if-no-files-found: ignore
          retention-days: 90

  golden-path:
    # Phase 0 exit criterion: a package scaffolded with /scaffold is green in < 10 min. The probe package and
    # service are throwaway (never committed); the job fails if scaffold → green exceeds the budget.
    name: Scaffold golden path (timed)
    runs-on: ubuntu-latest
    # Above the budget so an overrun is reported by the budget check, not by a job kill.
    timeout-minutes: 15
    env:
      BUDGET_SECONDS: 600
    steps:
      - name: Start clock
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Scaffold throwaway targets
        run: |
          node tools/scaffold/scaffold.mjs packages/golden-path-probe --owner devops-sre --unlisted
          node tools/scaffold/scaffold.mjs services/golden-path-svc --owner backend-engineer --unlisted --preset strict
          filters="--filter=@codelex/golden-path-probe --filter=@codelex/golden-path-svc"
          # Until the real package exists, also prove a scaffolded game-engine passes the purity/determinism lint.
          if [ ! -d packages/game-engine ]; then
            node tools/scaffold/scaffold.mjs packages/game-engine
            filters="$filters --filter=@codelex/game-engine"
          fi
          echo "FILTERS=$filters" >> "$GITHUB_ENV"
      # The probes are new workspace members, so the lockfile must change; it is never committed from CI.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm turbo run lint typecheck format:check test $FILTERS
      - name: Check time budget
        run: |
          elapsed=$(( $(date +%s) - START ))
          echo "Scaffold golden path: ${elapsed}s (budget ${BUDGET_SECONDS}s)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$BUDGET_SECONDS" ]; then echo "::error::golden path over budget"; exit 1; fi

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level=high
