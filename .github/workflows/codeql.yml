name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The repository is private without GitHub Advanced Security, so SARIF upload to code scanning is
    # unavailable. Results stay on the runner and any finding fails the job. When the repository becomes public
    # or gets Advanced Security: set `upload: always` and grant `security-events: write`.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
          upload: never
          output: ${{ runner.temp }}/codeql-results
      - name: Fail on findings
        env:
          RESULTS_DIR: ${{ runner.temp }}/codeql-results
        run: |
          set -euo pipefail
          jq -r '.runs[].results[]? | "\(.ruleId): \(.message.text) (\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine))"' "${RESULTS_DIR}"/*.sarif
          count=$(jq -s '[.[].runs[].results[]?] | length' "${RESULTS_DIR}"/*.sarif)
          echo "CodeQL findings: ${count}"
          test "${count}" -eq 0
