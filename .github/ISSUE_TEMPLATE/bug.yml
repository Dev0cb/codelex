name: Bug
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["S1 — crash, data loss, cheating exploit, payment", "S2 — major feature broken", "S3 — degraded", "S4 — cosmetic"]
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: Include match id / seed / app version when relevant }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual }
    validations: { required: true }
