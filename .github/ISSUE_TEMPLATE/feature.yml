name: Feature idea
description: Propose a feature, mode, power or capability (becomes a spec via /feature-spec)
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem / opportunity, description: Who has which problem? Evidence? }
    validations: { required: true }
  - type: input
    id: vision
    attributes: { label: Vision reference, placeholder: "V-08 Tech Powers" }
  - type: textarea
    id: idea
    attributes: { label: Proposed solution }
  - type: textarea
    id: success
    attributes: { label: How we know it worked (KPI) }
